<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THCS Trưng Vương Đà Nẵng - Đánh giá năng lực</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="toast"></div>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">TV</div>
      <div><b>THCS Trưng Vương Đà Nẵng</b><span>Đánh giá năng lực & thu nhập tăng thêm</span></div>
    </div>
    <nav id="menu"></nav>
    <div class="sidebar-footer">
      <span id="syncStatus">Local mode</span>
      <button id="btnSeed">Tạo dữ liệu mẫu</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageDesc">Quản trị quy trình đánh giá tháng, quý, năm học</p>
      </div>
      <div class="top-actions">
        <input id="globalSearch" placeholder="Tìm nhanh: tên, mã CB, tổ, xếp loại..." />
        <select id="schoolYear"></select>
        <select id="period"></select>
        <button id="btnSaveFirebase" class="primary">Đồng bộ Firebase</button>
      </div>
    </header>
    <section id="app"></section>
  </main>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
